<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아주 복잡하고 매우 어려우며 상당히 번거로운 무대 장치</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grandiflora+One&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/circuit.css">

    <style>
        @keyframes fadein {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-element {
            animation: fadein 1s ease-out;
        }
    </style>
</head>
<body class="noto-serif-kr">

    <div id="app" class="container-fluid d-flex flex-column align-items-center justify-content-center min-vh-100 fade-in-element">
        <header class="text-center mb-4">
            <h1 class="grandiflora-one-regular display-3" style="color: #d4af37; text-shadow: 0 0 13px rgba(212, 175, 55, 0.4);">
                아주 복잡하고 매우 어려우며 상당히 번거로운 무대 장치
            </h1>
            <p class="noto-serif-kr" style="color: #b4a078; letter-spacing: 2px;">
                Alien T is coming!
            </p>
        </header>

        <div class="card mb-4" style="background: rgba(0, 0, 0, 0.5); border: 1px solid #4a4d44; max-width: 800px;">
            <div class="card-body noto-serif-kr text-center" style="color: #e0d7c6; font-size: 0.95rem;">
                 1. <strong>황동색 테두리</strong>가 있는 패널은 클릭하여 회전할 수 있습니다.<br>
                 2. <strong>주황색으로 빛나는 지점</strong>이 시작점과 끝점입니다. 시작부터 끝까지 주황색 전류를 이어 주십시오.<br>
                 3. 숫자가 적힌 패널은 <strong>차원문(포털)</strong>입니다. 한쪽 숫자로 들어간 전류는 다른 쪽의 같은 숫자로 이동하여 흐릅니다.<br>
                 4. 모든 전류가 끝점에 도달하여 전체 회로가 <strong>주황색</strong>으로 연결되면, 무대 장치가 작동합니다.
            </div>
        </div>

        <game-board></game-board>

        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        import App from './js/app.js';

        // 앱 인스턴스 생성
        const app = createApp({});
        
        // app.js에서 가져온 객체를 'game-board' 컴포넌트로 등록
        app.component('game-board', App);
        
        // #app 요소에 마운트
        app.mount('#app');
    </script>
</body>
</html>
