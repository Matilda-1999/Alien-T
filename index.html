<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아주 복잡하고 매우 어려우며 상당히 번거로운 무대 장치</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grandiflora+One&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/circuit.css">
</head>
<body class="noto-serif-kr">

    <div id="app" class="container-fluid d-flex flex-column align-items-center justify-content-center min-vh-100">
        <header class="text-center mb-4">
            <h1 class="grandiflora-one-regular display-3" style="color: #d4af37; text-shadow: 0 0 13px rgba(212, 175, 55, 0.4);">
                아주 복잡하고 매우 어려우며 상당히 번거로운 무대 장치
            </h1>
            <p class="noto-serif-kr" style="color: #b4a078; letter-spacing: 2px;">
                Alien T is coming!
            </p>
        </header>

        <div class="card mb-4" style="background: rgba(0, 0, 0, 0.5); border: 1px solid #4a4d44; max-width: 600px;">
            <div class="card-body noto-serif-kr text-center" style="color: #e0d7c6; font-size: 0.95rem;">
                        1. <strong>황동색 테두리</strong>가 있는 패널은 클릭하여 회전할 수 있습니다.<br>
                        2. 숫자가 적힌 패널이 <strong>메인 회로</strong>입니다. 같은 숫자끼리 전류가 흐릅니다.<br>
                        3. 전류가 시작점에서 끝점까지 끊기지 않고 흐르면, 무대 장치가 작동합니다.
            </div>
        </div>

        <game-board></game-board>


        <script type="module">
        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        import App from './js/app.js';

        const app = createApp({});
        app.component('game-board', App); // app.js를 'game-board'라는 이름의 컴포넌트로 등록
        app.mount('#app');
    </script>
        
    <style>
        @keyframes fadein {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
